<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Educator Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>Educator Dashboard</h1>
    <div style="margin-bottom: 20px;">
        <a href="/educator/exam/new" class="btn">Create New Exam</a>
        <a href="/logout" class="btn btn-secondary">Logout</a>
    </div>

    <section class="table-section">
        <h2>Your Exams</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Exam Name</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Show message if exams list is empty -->
            <tr th:if="${#lists.isEmpty(exams)}">
                <td colspan="6" style="text-align:center; color: #999;">You haven't created any exams yet.</td>
            </tr>

            <!-- Iterate and show exams -->
            <tr th:each="exam : ${exams}">
                <td th:text="${exam.id}"></td>
                <td th:text="${exam.name}"></td>
                <td th:text="${exam.subject}"></td>
                <td th:text="${exam.scheduledDate}"></td>
                <td th:text="${exam.scheduledTime}"></td>
                <td>
                    <a th:href="@{/educator/exam/edit/{id}(id=${exam.id})}" class="btn">Edit</a>
                    <a th:href="@{/educator/exam/delete/{id}(id=${exam.id})}"
                       onclick="return confirm('Are you sure you want to delete this exam?')"
                       class="btn btn-secondary">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
<script src="/js/script.js"></script>
</html>
