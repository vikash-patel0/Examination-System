<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <meta charset="UTF-8" />
</head>
<body>
<div class="container">
    <h2>Login</h2>

    <p th:if="${error}" style="color:red; font-weight: 600;" th:text="${error}"></p>

    <form action="/login" method="post" autocomplete="off" style="display: flex; flex-direction: column; gap: 15px;">
        <label for="usernameOrEmail">Username or Email:</label>
        <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-input" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" class="form-input" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        Don't have an account?
        <a href="/register" class="form-link">Register</a>
    </p>
</div>
</body>
<script src="/js/script.js"></script>
</html>
