<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register</title>
  <link rel="stylesheet" href="/css/styles.css">
  <meta charset="UTF-8" />
</head>
<body>
<div class="container">
  <h2>Register</h2>

  <p th:if="${message}" style="color:green; font-weight: 600;" th:text="${message}"></p>

  <form action="/register" method="post" autocomplete="off" style="display: flex; flex-direction: column; gap: 15px;">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" class="form-input" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" class="form-input" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" class="form-input" required>

    <label for="role">Role:</label>
    <select id="role" name="role" class="form-input" required>
      <option value="" disabled selected>Select role</option>
      <option value="STUDENT">Student</option>
      <option value="EDUCATOR">Educator</option>
    </select>

    <button type="submit" class="btn">Register</button>
  </form>

  <p style="margin-top: 20px; text-align: center;">
    Already have an account?
    <a href="/login" class="form-link">Login</a>
  </p>
</div>
</body>
<script src="/js/script.js"></script>
</html>
